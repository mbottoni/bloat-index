[project]
name = "bloat-index"
version = "0.1.0"
description = "Measure what agent frameworks cost before they do any work."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Maruan Ottoni" }]
keywords = ["llm", "agents", "benchmark", "tokens", "overhead"]
dependencies = ["tiktoken>=0.7"]

[project.urls]
Homepage = "https://github.com/mbottoni/bloat-index"

[project.scripts]
bloatindex = "bloatindex.measure:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bloatindex"]
